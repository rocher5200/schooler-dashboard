<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schooler績效看板</title>
  <style>
    :root {
      --ink: #17231f;
      --muted: #66716b;
      --line: #d9d4c8;
      --paper: #fffdfa;
      --wash: #f6f4ef;
      --teal: #287b75;
      --green: #287a48;
      --red: #bc5141;
      --gold: #b9842f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1440px, 100%); margin: 0 auto; padding: 28px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      padding: 18px 0 22px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1, h2, p { margin-top: 0; }
    h1 {
      margin-bottom: 0;
      font-size: clamp(2.15rem, 5vw, 4.6rem);
      line-height: .95;
      letter-spacing: 0;
    }
    h2 { margin-bottom: 0; font-size: 1rem; }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: end;
      min-width: min(560px, 100%);
    }
    .control {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 0 12px;
      box-shadow: 0 12px 34px rgba(42, 48, 43, .06);
    }
    .control select, .control input {
      min-width: 170px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
    }
    .control input { min-width: 245px; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 18px 50px rgba(42, 48, 43, .08);
    }
    .kpi {
      min-height: 126px;
      padding: 18px;
      display: grid;
      align-content: space-between;
      gap: 10px;
    }
    .kpi .label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 750;
    }
    .kpi strong {
      font-size: clamp(1.24rem, 2vw, 1.9rem);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }
    .panel { padding: 18px; }
    .video-panel {
      margin-bottom: 18px;
      padding: 18px;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .video-metric {
      min-height: 104px;
      border: 1px solid #e2dacc;
      border-radius: 8px;
      background: #f9f6ed;
      padding: 16px;
      display: grid;
      gap: 8px;
    }
    .video-metric span {
      color: var(--muted);
      font-size: .88rem;
      font-weight: 750;
    }
    .video-metric strong {
      font-size: clamp(1.25rem, 2vw, 1.8rem);
      overflow-wrap: anywhere;
    }
    .video-table-wrap {
      overflow-x: auto;
      max-height: 320px;
    }
    .trend {
      height: 286px;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(72px, 1fr);
      gap: 14px;
      align-items: end;
      overflow-x: auto;
      padding: 8px 4px 0;
    }
    .trend-item {
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 8px;
      text-align: center;
    }
    .bar {
      position: relative;
      height: 100%;
      border-radius: 8px;
      background: #eef1ec;
      overflow: hidden;
    }
    .paid-bar, .qty-bar {
      position: absolute;
      bottom: 0;
      border-radius: 8px 8px 0 0;
    }
    .paid-bar {
      left: 16%;
      width: 48%;
      background: linear-gradient(180deg, #5eb0a6, #216d66);
    }
    .qty-bar {
      right: 14%;
      width: 20%;
      background: var(--gold);
    }
    .trend-item strong { font-size: .9rem; }
    .trend-item small { color: var(--muted); }
    .ranking {
      display: grid;
      gap: 12px;
      max-height: 340px;
      overflow: auto;
      padding-right: 4px;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 12px;
      align-items: start;
      padding-bottom: 12px;
      border-bottom: 1px solid #ece6dc;
    }
    .rank {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-weight: 900;
    }
    .rank-row strong, .rank-row small { display: block; }
    .rank-row strong { line-height: 1.35; }
    .rank-row small { color: var(--muted); margin-top: 4px; }
    .money { text-align: right; font-weight: 900; white-space: nowrap; }
    .track {
      grid-column: 2 / -1;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e4ded2;
    }
    .track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--teal);
    }
    .table-card { padding: 18px; }
    .table-wrap { overflow-x: auto; max-height: 560px; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td {
      padding: 13px 10px;
      border-bottom: 1px solid #ece6dc;
      text-align: left;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--paper);
      color: #53605a;
      font-size: .82rem;
      white-space: nowrap;
    }
    td { font-weight: 650; }
    td.num { text-align: right; white-space: nowrap; }
    .status {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.5;
    }
    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 1080px) {
      .topbar { align-items: stretch; flex-direction: column; }
      .controls { justify-content: start; }
      .kpis, .layout { grid-template-columns: 1fr 1fr; }
      .video-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .shell { padding: 16px; }
      .kpis, .layout { grid-template-columns: 1fr; }
      .video-grid { grid-template-columns: 1fr; }
      .control, .control select, .control input { width: 100%; min-width: 0; }
      .rank-row { grid-template-columns: 36px 1fr; }
      .money { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <p class="eyebrow">Course Revenue Dashboard</p>
        <h1>Schooler績效看板</h1>
      </div>
      <div class="controls" aria-label="篩選工具">
        <label class="control">月份
          <select id="monthFilter"></select>
        </label>
        <label class="control">搜尋
          <input id="searchBox" type="search" placeholder="輸入課程名稱或培訓代碼">
        </label>
      </div>
    </section>

    <section class="kpis" aria-label="績效摘要">
      <article class="card kpi">
        <span class="label">總繳費金額</span>
        <strong id="totalPaid"></strong>
      </article>
      <article class="card kpi">
        <span class="label">總銷售數量</span>
        <strong id="totalQty"></strong>
      </article>
      <article class="card kpi">
        <span class="label">有繳費課程數</span>
        <strong id="activeCourses"></strong>
      </article>
      <article class="card kpi">
        <span class="label">最高繳費課程</span>
        <strong id="topCourse"></strong>
      </article>
    </section>

    <section class="card video-panel" aria-label="影音課程銷售">
      <div class="panel-heading">
        <h2>影音課程銷售</h2>
        <span id="videoStatus" class="status"></span>
      </div>
      <div class="video-grid">
        <article class="video-metric">
          <span>影音課程銷售數量</span>
          <strong id="videoQty"></strong>
        </article>
        <article class="video-metric">
          <span>影音課程繳費金額</span>
          <strong id="videoPaid"></strong>
        </article>
        <article class="video-metric">
          <span>影音課程分潤金額</span>
          <strong id="videoShare"></strong>
        </article>
      </div>
      <div class="video-table-wrap">
        <table>
          <thead>
            <tr>
              <th>培訓代碼</th>
              <th>培訓課程</th>
              <th>銷售數量</th>
              <th>繳費金額</th>
              <th>分潤金額</th>
            </tr>
          </thead>
          <tbody id="videoRows"></tbody>
        </table>
      </div>
    </section>

    <section class="layout">
      <div class="card panel">
        <div class="panel-heading">
          <h2>月份趨勢</h2>
          <span class="status">綠色：繳費金額｜金色：銷售數量</span>
        </div>
        <div id="trend" class="trend"></div>
      </div>

      <div class="card panel">
        <div class="panel-heading">
          <h2>課程排行榜</h2>
          <span id="rankStatus" class="status"></span>
        </div>
        <div id="ranking" class="ranking"></div>
      </div>
    </section>

    <section class="card table-card">
      <div class="panel-heading">
        <h2>明細資料</h2>
        <span id="detailStatus" class="status"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>月份</th>
              <th>培訓代碼</th>
              <th>培訓課程</th>
              <th>銷售數量</th>
              <th>繳費金額</th>
            </tr>
          </thead>
          <tbody id="detailRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./sales-data.js"></script>
  <script>
    const data = Array.isArray(window.SALES_DATA) ? window.SALES_DATA : [];
    const monthFilter = document.getElementById("monthFilter");
    const searchBox = document.getElementById("searchBox");
    const money = new Intl.NumberFormat("zh-TW", {
      style: "currency",
      currency: "TWD",
      maximumFractionDigits: 0
    });
    const number = new Intl.NumberFormat("zh-TW");

    function byFilters(row) {
      const monthOk = monthFilter.value === "all" || row.month === monthFilter.value;
      const q = searchBox.value.trim().toLowerCase();
      const searchOk = !q || row.course.toLowerCase().includes(q) || row.code.toLowerCase().includes(q);
      return monthOk && searchOk;
    }

    function groupCourses(rows) {
      const map = new Map();
      rows.forEach((row) => {
        const key = row.code + "::" + row.course;
        const item = map.get(key) || { code: row.code, course: row.course, quantity: 0, paid: 0, share: 0 };
        item.quantity += Number(row.quantity) || 0;
        item.paid += Number(row.paid) || 0;
        item.share += getShare(row);
        map.set(key, item);
      });
      return [...map.values()].sort((a, b) => b.paid - a.paid || b.quantity - a.quantity);
    }

    function isVideoCourse(row) {
      return row.course.includes("菜鳥救星-(影)");
    }

    function getShare(row) {
      return (Number(row.quantity) || 0) * (Number(row.price) || 0) * 0.3;
    }

    function groupMonths(rows) {
      const months = [...new Set(data.map((row) => row.month))].sort();
      return months.map((month) => {
        const monthRows = rows.filter((row) => row.month === month);
        return {
          month,
          paid: monthRows.reduce((sum, row) => sum + row.paid, 0),
          quantity: monthRows.reduce((sum, row) => sum + row.quantity, 0)
        };
      });
    }

    function renderMonths() {
      const months = [...new Set(data.map((row) => row.month))].sort();
      monthFilter.innerHTML = '<option value="all">全部月份</option>' + months.map((m) => `<option value="${m}">${m}</option>`).join("");
    }

    function render() {
      const rows = data.filter(byFilters);
      const grouped = groupCourses(rows);
      const positive = grouped.filter((row) => row.paid > 0);
      const totalPaid = rows.reduce((sum, row) => sum + row.paid, 0);
      const totalQty = rows.reduce((sum, row) => sum + row.quantity, 0);
      const top = positive[0];

      document.getElementById("totalPaid").textContent = money.format(totalPaid);
      document.getElementById("totalQty").textContent = `${number.format(totalQty)} 件`;
      document.getElementById("activeCourses").textContent = `${number.format(positive.length)} 門`;
      document.getElementById("topCourse").textContent = top ? top.course : "無資料";

      renderVideoCourses(rows);
      renderTrend(rows);
      renderRanking(positive);
      renderDetails(rows);
    }

    function renderVideoCourses(rows) {
      const videoRows = groupCourses(rows.filter(isVideoCourse));
      const positiveVideoRows = videoRows.filter((row) => row.quantity > 0 || row.paid > 0 || row.share > 0);
      const totalQty = positiveVideoRows.reduce((sum, row) => sum + row.quantity, 0);
      const totalPaid = positiveVideoRows.reduce((sum, row) => sum + row.paid, 0);
      const totalShare = positiveVideoRows.reduce((sum, row) => sum + row.share, 0);

      document.getElementById("videoQty").textContent = `${number.format(totalQty)} 件`;
      document.getElementById("videoPaid").textContent = money.format(totalPaid);
      document.getElementById("videoShare").textContent = money.format(totalShare);
      document.getElementById("videoStatus").textContent = `分潤 = 銷售數量 × 售價 × 30%，顯示 ${number.format(positiveVideoRows.length)} 門`;
      document.getElementById("videoRows").innerHTML = positiveVideoRows.length ? positiveVideoRows.map((row) => `
        <tr>
          <td>${escapeHtml(row.code)}</td>
          <td>${escapeHtml(row.course)}</td>
          <td class="num">${number.format(row.quantity)}</td>
          <td class="num">${money.format(row.paid)}</td>
          <td class="num">${money.format(row.share)}</td>
        </tr>
      `).join("") : '<tr><td colspan="5" class="empty">沒有符合條件的影音課程銷售資料</td></tr>';
    }

    function renderTrend(rows) {
      const trend = groupMonths(rows);
      const maxPaid = Math.max(...trend.map((item) => item.paid), 1);
      const maxQty = Math.max(...trend.map((item) => item.quantity), 1);
      document.getElementById("trend").innerHTML = trend.map((item) => `
        <div class="trend-item">
          <div class="bar" title="${item.month}：${money.format(item.paid)} / ${number.format(item.quantity)} 件">
            <span class="paid-bar" style="height:${Math.max(item.paid / maxPaid * 100, item.paid ? 7 : 0)}%"></span>
            <span class="qty-bar" style="height:${Math.max(item.quantity / maxQty * 100, item.quantity ? 7 : 0)}%"></span>
          </div>
          <strong>${item.month.slice(5)}</strong>
          <small>${money.format(item.paid)}</small>
        </div>
      `).join("");
    }

    function renderRanking(rows) {
      const topRows = rows.slice(0, 30);
      const maxPaid = Math.max(...topRows.map((item) => item.paid), 1);
      document.getElementById("rankStatus").textContent = `顯示前 ${number.format(topRows.length)} 名`;
      document.getElementById("ranking").innerHTML = topRows.length ? topRows.map((item, index) => `
        <div class="rank-row">
          <span class="rank">${index + 1}</span>
          <div>
            <strong>${escapeHtml(item.course)}</strong>
            <small>${item.code} · 銷售 ${number.format(item.quantity)} 件</small>
          </div>
          <div class="money">${money.format(item.paid)}</div>
          <div class="track"><span style="width:${Math.max(item.paid / maxPaid * 100, 4)}%"></span></div>
        </div>
      `).join("") : '<div class="empty">沒有符合條件的繳費課程</div>';
    }

    function renderDetails(rows) {
      const sorted = [...rows].sort((a, b) => a.month.localeCompare(b.month) || b.paid - a.paid);
      document.getElementById("detailStatus").textContent = `共 ${number.format(sorted.length)} 筆，包含繳費金額為 0 的課程`;
      document.getElementById("detailRows").innerHTML = sorted.map((row) => `
        <tr>
          <td>${row.month}</td>
          <td>${escapeHtml(row.code)}</td>
          <td>${escapeHtml(row.course)}</td>
          <td class="num">${number.format(row.quantity)}</td>
          <td class="num">${money.format(row.paid)}</td>
        </tr>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    renderMonths();
    render();
    monthFilter.addEventListener("change", render);
    searchBox.addEventListener("input", render);
  </script>
</body>
</html>
